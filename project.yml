# XcodeGen spec — run `xcodegen generate` (brew install xcodegen) to create Bifold.xcodeproj.
# Build the emulation core first: ./scripts/build-core-ios.sh  (see README.md)

name: Bifold
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

configs:
  Debug: debug
  Release: release
  AppStore: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # ← your Team ID, or pick it in Xcode › Signing & Capabilities
    CODE_SIGN_STYLE: Automatic

targets:
  Bifold:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Core/include
        buildPhase: none
    settings:
      base:
        INFOPLIST_FILE: App/Config/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bifold   # ← change to your own
        PRODUCT_NAME: Bifold
        PRODUCT_DISPLAY_NAME: Bifold
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # arm64 device, plus the arm64 simulator on Apple silicon Macs
        # (build the core with ./scripts/build-core-ios.sh --sdk simulator).
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ARCHS: arm64
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        ONLY_ACTIVE_ARCH: NO
        ENABLE_BITCODE: NO
        # AzaharCore C API (module.modulemap lives next to the header).
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Core/include
        HEADER_SEARCH_PATHS: $(SRCROOT)/Core/include
        AZ_FLAVOR: sideload
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/ios-$(AZ_FLAVOR)/lib
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/build/ios-sim-$(AZ_FLAVOR)/lib
        OTHER_LDFLAGS:
          - -lAzaharCore
          - -lc++
          - -lz
          - -liconv
          - -framework Metal
          - -framework QuartzCore
          - -framework IOSurface
          - -framework AVFoundation
          - -framework AudioToolbox
          - -framework CoreAudio
          - -framework CoreMotion
          - -framework GameController
          - -framework Network
          - -framework CoreFoundation
        CODE_SIGN_ENTITLEMENTS: App/Config/Sideload.entitlements
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        AppStore:
          AZ_FLAVOR: appstore
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
          CODE_SIGN_ENTITLEMENTS: App/Config/AppStore.entitlements
    dependencies:
      # Dynamic MoltenVK (Vulkan → Metal), embedded and signed into the app.
      - framework: build/MoltenVK/MoltenVK.xcframework
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Check AzaharCore
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then DIR=ios-sim; SDKARG="--sdk simulator"; else DIR=ios; SDKARG=""; fi
          LIB="${SRCROOT}/build/${DIR}-${AZ_FLAVOR}/lib/libAzaharCore.a"
          if [ ! -f "$LIB" ]; then
            echo "error: $LIB not found. Run: ./scripts/build-core-ios.sh --flavor ${AZ_FLAVOR} ${SDKARG}"
            exit 1
          fi

schemes:
  Bifold:
    build:
      targets:
        Bifold: all
    run:
      config: Debug
    archive:
      config: Release
  Bifold-AppStore:
    build:
      targets:
        Bifold: all
    run:
      config: AppStore
    archive:
      config: AppStore
